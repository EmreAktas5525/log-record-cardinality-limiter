[project]
name = "log-record-cardinality-limiter"
version = "0.1.0"
description = "Limits distinct values per attribute key in structured logs, dropping or marking overflow"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
